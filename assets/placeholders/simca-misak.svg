<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Simča and Mišák under winter stars">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1f"/>
      <stop offset="50%" stop-color="#111d3a"/>
      <stop offset="100%" stop-color="#181c3a"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="35%" stop-color="#a78bfa" stop-opacity="0.65"/>
      <stop offset="65%" stop-color="#f472b6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#34f5b5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#34f5b5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#34f5b5" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1200" height="750" fill="url(#sky2)"/>
  <path d="M-20 260 C240 110, 500 280, 740 165 C940 70, 1080 210, 1230 140 L1230 330 C1050 385, 890 250, 700 340 C480 435, 220 290, -20 400 Z" fill="url(#aur2)" filter="url(#blur2)"/>

  <!-- Stars -->
  <g fill="#f1f5f9" opacity="0.8">
    <circle cx="160" cy="110" r="1.8"/><circle cx="310" cy="80" r="2.2"/><circle cx="460" cy="150" r="1.4"/>
    <circle cx="600" cy="95" r="2.4"/><circle cx="745" cy="145" r="1.5"/><circle cx="890" cy="90" r="2"/>
    <circle cx="1040" cy="130" r="1.7"/><circle cx="240" cy="230" r="1.3"/><circle cx="960" cy="240" r="1.6"/>
  </g>

  <!-- Glowing arc connecting Oulu and Home -->
  <path d="M270 360 Q600 185 930 360" fill="none" stroke="#34f5b5" stroke-width="2.2" stroke-dasharray="6 9" opacity="0.7"/>
  <circle cx="270" cy="360" r="6" fill="#34f5b5"/>
  <circle cx="930" cy="360" r="6" fill="#f472b6"/>

  <!-- Snow ground -->
  <path d="M0 575 Q300 520 600 555 T1200 560 L1200 750 L0 750 Z" fill="#091428"/>

  <!-- Warm heart aura behind couple -->
  <circle cx="600" cy="490" r="160" fill="url(#heartGlow)"/>

  <!-- Couple silhouette (Mišák & Simča) -->
  <g fill="#050b18">
    <!-- Mišák -->
    <circle cx="574" cy="466" r="23"/>
    <path d="M546 498 C552 488, 594 488, 598 500 L604 610 L538 610 Z"/>
    <!-- Simča leaning slightly closer -->
    <circle cx="624" cy="476" r="21"/>
    <path d="M600 505 C604 496, 642 496, 646 507 L656 610 L594 610 Z"/>
  </g>

  <!-- Floating small star heart above -->
  <path d="M600 412 C600 412, 584 401, 584 391.5 C584 386.5, 588 383, 592.5 383 C595.7 383, 598.4 384.8, 600 387.5 C601.6 384.8, 604.3 383, 607.5 383 C612 383, 616 386.5, 616 391.5 C616 401, 600 412, 600 412 Z" fill="#f472b6" opacity="0.85"/>

  <g font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">
    <text x="600" y="672" fill="#e9d5ff" font-size="18" letter-spacing="5" font-weight="600">SIMČA &amp; MIŠÁK</text>
    <text x="600" y="704" fill="#cbd5e1" font-size="15" opacity="0.75">Drop your couple photos into photos/us/</text>
  </g>
</svg>
