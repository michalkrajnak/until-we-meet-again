<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Simča under the northern lights in Oulu">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050d1e"/>
      <stop offset="55%" stop-color="#0a1f38"/>
      <stop offset="100%" stop-color="#0e2c45"/>
    </linearGradient>
    <linearGradient id="aur1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#34f5b5" stop-opacity="0"/>
      <stop offset="30%" stop-color="#34f5b5" stop-opacity="0.72"/>
      <stop offset="65%" stop-color="#22d3ee" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lantern1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#sky1)"/>

  <!-- Stars -->
  <g fill="#e2f3ff" opacity="0.75">
    <circle cx="140" cy="90" r="1.8"/><circle cx="260" cy="140" r="1.3"/><circle cx="380" cy="70" r="2"/>
    <circle cx="520" cy="110" r="1.4"/><circle cx="690" cy="65" r="2.1"/><circle cx="830" cy="125" r="1.5"/>
    <circle cx="960" cy="85" r="1.8"/><circle cx="1080" cy="150" r="1.4"/><circle cx="190" cy="220" r="1.2"/>
    <circle cx="1010" cy="220" r="1.7"/><circle cx="760" cy="185" r="1.2"/><circle cx="445" cy="165" r="1.6"/>
  </g>

  <!-- Aurora curtains -->
  <path d="M-40 270 C190 120, 390 300, 620 190 C840 85, 1020 220, 1240 130 L1240 310 C1020 390, 820 260, 610 350 C390 440, 190 290, -40 410 Z" fill="url(#aur1)" filter="url(#blur1)"/>
  <path d="M80 200 C310 90, 560 250, 820 140 C990 70, 1110 150, 1240 100 L1240 220 C1080 280, 960 195, 790 255 C540 340, 300 200, 80 300 Z" fill="url(#aur1)" opacity="0.65" filter="url(#blur1)"/>

  <!-- Snow hills & Nordic pines -->
  <path d="M0 570 Q280 515 600 560 T1200 545 L1200 750 L0 750 Z" fill="#071529"/>
  <path d="M0 610 Q360 565 720 615 T1200 595 L1200 750 L0 750 Z" fill="#0b1d35"/>

  <!-- Pine tree silhouettes -->
  <g fill="#050e1d">
    <polygon points="110,565 145,455 180,565"/><polygon points="155,575 185,485 215,575"/>
    <polygon points="225,570 250,500 275,570"/><polygon points="910,565 948,448 986,565"/>
    <polygon points="975,572 1008,475 1041,572"/><polygon points="1045,565 1085,435 1125,565"/>
  </g>

  <!-- Warm lantern glow & Simca silhouette -->
  <circle cx="600" cy="540" r="120" fill="url(#lantern1)"/>
  <g fill="#091529">
    <circle cx="600" cy="482" r="22"/>
    <path d="M578 510 C582 500, 618 500, 622 510 L634 612 L566 612 Z"/>
    <!-- Scarf flowing slightly -->
    <path d="M614 510 Q644 518 656 534 Q634 532 612 522 Z" fill="#34f5b5" opacity="0.75"/>
  </g>

  <!-- Subtle typography badge -->
  <g font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">
    <text x="600" y="672" fill="#99f6e4" font-size="18" letter-spacing="5" font-weight="600">OULU · FINLAND · 65°N</text>
    <text x="600" y="704" fill="#cbd5e1" font-size="15" opacity="0.75">Add your favorite photos of Simča to photos/simca/</text>
  </g>
</svg>
